# ポストのプラグインの見本。本体のワークスペースとは別に、WASM 向けに作る。
#
#   cargo build --release --target wasm32-unknown-unknown
#   wasm-tools component new target/wasm32-unknown-unknown/release/kmb_post_example.wasm \
#     -o ../post-example.wasm
[package]
name = "kmb-post-example"
description = "ポストのプラグインの見本(Grbl 系の G-code)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kmb-post = { path = "../../crates/kmb-post" }
kmb-toolpath = { path = "../../crates/kmb-toolpath" }
serde_json = "1.0.154"
wit-bindgen = { version = "0.61.1", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[workspace]
