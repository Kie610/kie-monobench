[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# 当てる写し(下の [patch.crates-io])。ワークスペースの検査・層の決まりの外に置く
exclude = ["third_party/truck-shapeops"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
encoding_rs = "0.8"
kmb-expr = { path = "crates/kmb-expr" }
kmb-core = { path = "crates/kmb-core" }
kmb-contract = { path = "crates/kmb-contract" }
kmb-sketch = { path = "crates/kmb-sketch" }
kmb-sketch-3d = { path = "crates/kmb-sketch-3d" }
kmb-sketch-solver = { path = "crates/kmb-sketch-solver" }
kmb-text = { path = "crates/kmb-text" }
kmb-io-dxf = { path = "crates/kmb-io-dxf" }
kmb-io-svg = { path = "crates/kmb-io-svg" }
kmb-format = { path = "crates/kmb-format" }
kmb-image = { path = "crates/kmb-image" }
kmb-look = { path = "crates/kmb-look" }
kmb-i18n = { path = "crates/kmb-i18n" }
kmb-ui = { path = "crates/kmb-ui" }
kmb-ui-sketch = { path = "crates/kmb-ui-sketch" }
kmb-ui-tools = { path = "crates/kmb-ui-tools" }
kmb-ui-text = { path = "crates/kmb-ui-text" }
kmb-ui-mouse3d = { path = "crates/kmb-ui-mouse3d" }
kmb-ui-library = { path = "crates/kmb-ui-library" }
kmb-ui-view3d = { path = "crates/kmb-ui-view3d" }
kmb-measure = { path = "crates/kmb-measure" }
kmb-fea = { path = "crates/kmb-fea" }
kmb-flow = { path = "crates/kmb-flow" }
kmb-hrtf = { path = "crates/kmb-hrtf" }
kmb-study = { path = "crates/kmb-study" }
kmb-render = { path = "crates/kmb-render" }
kmb-kernel-truck = { path = "crates/kmb-kernel-truck" }
kmb-kernel-smlib = { path = "crates/kmb-kernel-smlib" }
smlib-sys = { path = "crates/smlib-sys" }
kmb-solid = { path = "crates/kmb-solid" }
kmb-cad = { path = "crates/kmb-cad" }
kmb-interchange = { path = "crates/kmb-interchange" }
kmb-cad-extrude = { path = "crates/kmb-cad-extrude" }
kmb-cad-surface = { path = "crates/kmb-cad-surface" }
kmb-cad-revolve = { path = "crates/kmb-cad-revolve" }
kmb-cad-sweep = { path = "crates/kmb-cad-sweep" }
kmb-cad-boolean = { path = "crates/kmb-cad-boolean" }
kmb-cad-datum = { path = "crates/kmb-cad-datum" }
kmb-cad-hole = { path = "crates/kmb-cad-hole" }
kmb-cad-pattern = { path = "crates/kmb-cad-pattern" }
kmb-cad-modify = { path = "crates/kmb-cad-modify" }
kmb-asm = { path = "crates/kmb-asm" }
kmb-cad-edge = { path = "crates/kmb-cad-edge" }
kmb-cad-import-step = { path = "crates/kmb-cad-import-step" }
kmb-sketch-canvas = { path = "crates/kmb-sketch-canvas" }
kmb-scene = { path = "crates/kmb-scene" }
kmb-config = { path = "crates/kmb-config" }
kmb-io-stl = { path = "crates/kmb-io-stl" }
kmb-view-lines = { path = "crates/kmb-view-lines" }
kmb-drawing = { path = "crates/kmb-drawing" }
kmb-io-view = { path = "crates/kmb-io-view" }
kmb-io-render = { path = "crates/kmb-io-render" }
kmb-cam-tool = { path = "crates/kmb-cam-tool" }
kmb-cam-geom = { path = "crates/kmb-cam-geom" }
kmb-cam-setup = { path = "crates/kmb-cam-setup" }
kmb-toolpath = { path = "crates/kmb-toolpath" }
kmb-toolpath-fit = { path = "crates/kmb-toolpath-fit" }
kmb-toolpath-moves = { path = "crates/kmb-toolpath-moves" }
kmb-strategy-pencil = { path = "crates/kmb-strategy-pencil" }
kmb-strategy-face = { path = "crates/kmb-strategy-face" }
kmb-strategy-raster3d = { path = "crates/kmb-strategy-raster3d" }
kmb-strategy-waterline = { path = "crates/kmb-strategy-waterline" }
kmb-cam-dropcutter = { path = "crates/kmb-cam-dropcutter" }
kmb-strategy-rough3d = { path = "crates/kmb-strategy-rough3d" }
kmb-strategy-contour2d = { path = "crates/kmb-strategy-contour2d" }
kmb-strategy-chamfer = { path = "crates/kmb-strategy-chamfer" }
kmb-strategy-engrave = { path = "crates/kmb-strategy-engrave" }
kmb-strategy-laser = { path = "crates/kmb-strategy-laser" }
kmb-strategy-pocket2d = { path = "crates/kmb-strategy-pocket2d" }
kmb-strategy-adaptive2d = { path = "crates/kmb-strategy-adaptive2d" }
kmb-strategy-drill = { path = "crates/kmb-strategy-drill" }
kmb-post = { path = "crates/kmb-post" }
kmb-post-carvera-air = { path = "crates/kmb-post-carvera-air" }
kmb-gcode-read = { path = "crates/kmb-gcode-read" }
kmb-plugin-host = { path = "crates/kmb-plugin-host" }
kmb-sim = { path = "crates/kmb-sim" }
kmb-cam-commands = { path = "crates/kmb-cam-commands" }
kmb-cam-program = { path = "crates/kmb-cam-program" }
kmb-bundle = { path = "crates/kmb-bundle", default-features = false }
kmb-samples = { path = "crates/kmb-samples" }
kmb-session = { path = "crates/kmb-session" }
kmb-wave = { path = "crates/kmb-wave" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
miniz_oxide = "0.9.1"
hdf5-pure = "0.47.0"
sofar = { version = "0.4.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
crc32fast = "1.5.2"
# 下絵の絵(PNG・JPEG・BMP)の読み書き。eframe 経由で既に Cargo.lock にある
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
log = "0.4.34"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
# 輪郭のフォントの字の形(kmb-text)。egui の epaint と同じ版
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.12.0"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
# 画面の crate はどれを選んで組んでも、アプリ(eframe)と同じ機能の組み合わせにする。揃えた依存
# (kmb-workspace-hack)に画面の依存を入れないので、ここで揃えないと `-p kmb-ui` などで組んだ時に
# egui・wgpu・naga の機能がアプリと違い、同じ target に別の組ができる(docs/verify.md の 2 節)
egui = { version = "0.36.2", features = ["bytemuck", "persistence"] }
egui-wgpu = { version = "0.36.2", features = ["wayland", "winit", "x11"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "persistence"] }
rfd = "0.17.2"
egui_kittest = "0.36.2"
# 画面の部品の一覧(AccessKit の木)を読む(kmb-ui の drive。MIT OR Apache-2.0)
accesskit_consumer = "0.35.0"
# 画面の部品を並べる(Unity 式のドッキング。MIT)
egui_dock = { version = "0.21.1", features = ["serde"] }
cc = { version = "1.2", features = ["parallel"] }
truck-modeling = "0.6.0"
truck-shapeops = "0.4.0"
# 既定の "vtk"(VTK 形式の読み書き)は使わない。入れると古い quick-xml・lz4_flex(既知の脆弱性あり)が入る
truck-meshalgo = { version = "0.4.0", default-features = false, features = ["analyzers", "filters", "tessellation"] }
truck-stepio = "0.3.0"
truck-topology = "0.6.0"
cavalier_contours = "0.9.0"
i_overlay = { version = "9.1.0", default-features = false }
insta = "1.49.0"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
wasmtime = { version = "49.0.4", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "anyhow"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

# 自前の crate もデバッグ情報は行番号だけ。panic とクラッシュ報告のファイル名・行・関数名は残り、
# デバッガで変数の値が見られないだけ。target が約 4 割小さくなり、一から作る時間が約 3 割縮む
# (2026-10-17 測定、Kie の判断。docs/verify.md の 8 節)。デバッガで変数を見たい時だけ、
# `CARGO_PROFILE_DEV_DEBUG=full` を付けて組み立てる
[profile.dev]
debug = "line-tables-only"

# truck のブーリアンは最適化なしだと遅いので、依存先は開発ビルドでも最適化する
[profile.dev.package."*"]
opt-level = 2
# 依存先の詳しいデバッグ情報は使わない(行番号だけ残す)。テストの実行ファイルが小さくなり、リンクが速くなる
debug = "line-tables-only"

# シミュレーションは格子を細かく回すので、開発ビルドでも最適化する
[profile.dev.package.kmb-sim]
opt-level = 2

# 光線追跡と動画のコマは最適化なしだと何十倍も遅い
[profile.dev.package.kmb-render]
opt-level = 2

[profile.dev.package.kmb-io-render]
opt-level = 2

[profile.dev.package.kmb-strategy-raster3d]
opt-level = 2

[profile.dev.package.kmb-strategy-waterline]
opt-level = 2

[profile.dev.package.kmb-cam-dropcutter]
opt-level = 2

[profile.dev.package.kmb-strategy-adaptive2d]
opt-level = 2

[profile.dev.package.kmb-strategy-pencil]
opt-level = 2

[profile.dev.package.kmb-strategy-rough3d]
opt-level = 2

[profile.dev.package.kmb-toolpath-fit]
opt-level = 2

# 加工の試験で時間の大半を使う所(工具の形、加工領域、経路のつなぎ。つなぎは kmb-toolpath-moves)。どれも小さい crate なので、
# 最適化してもコンパイルはほとんど延びない(2026-10-17 測定。docs/verify.md の 6 節)
[profile.dev.package.kmb-cam-tool]
opt-level = 2

[profile.dev.package.kmb-cam-geom]
opt-level = 2

[profile.dev.package.kmb-toolpath-moves]
opt-level = 2

[profile.dev.package.kmb-toolpath]
opt-level = 2

# 削った所の空振りを省く計算(高さの格子に工具を押す)。加工の見本と台本の時間の多くを使う
[profile.dev.package.kmb-cam-program]
opt-level = 2

# 流れの格子の計算は最適化なしだと 20 倍ほど遅く、試験が長くなる
[profile.dev.package.kmb-flow]
opt-level = 2

# HRTF の格子の補間・再標本化・FFT は方向ごとに回すので、最適化なしだと数万方向の手順が重い
[profile.dev.package.kmb-hrtf]
opt-level = 2

# 四面体の網づくりと代数的マルチグリッドは最適化なしだと 10 倍以上遅く、曲面の検算が長くなる
[profile.dev.package.kmb-fea]
opt-level = 2

# 境界要素法の密な行列の組み立て(要素の対ごとの求積)は最適化なしだと 10 倍ほど遅く、球の検算が長くなる
[profile.dev.package.kmb-wave]
opt-level = 2

# 結果の見せ方(断面・流線・帯の切り分け)はコマを送るたびに作るので、最適化なしだと再生が重い
[profile.dev.package.kmb-study]
opt-level = 2

# truck のカーネルでの試験(`JC_KERNEL=truck`)が約 3 割速くなる(2026-10-15 測定)
[profile.dev.package.kmb-kernel-truck]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"

# truck-shapeops 0.4.0 の内外の数え方の誤り(空洞・裏返した道具)を直した写し(2026-10-20 Kie)。
# 中身と外す時の手順は third_party/README.md の「truck-shapeops/」
[patch.crates-io]
truck-shapeops = { path = "third_party/truck-shapeops" }

[profile.dev.package.kmb-sketch-solver]
opt-level = 2
