# タグ(v<版>)を押すと、配る物を Linux と Windows で組み立てる(docs/verify.md の 15 節)。
# - 組み立ては `cargo xtask release`(この PC のパスを exe に残さない引数と数え、許諾文の一覧)。
#   タグはワークスペースの版と合うかを xtask が先に確かめる。
# - 検査は取り込みの前の PC の回と毎晩の main の回(verify.yml)が済ませているので、ここでは流さない。
# - OS ごとに zip にまとめ、全部の zip の SHA256SUMS を最後の回で作る。
# - できた物は成果物(artifact)に置くだけで、GitHub のリリースは作らない。
name: リリース

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Rust(rust-toolchain.toml の版)
        run: rustup toolchain install

      # タグの回で残した物はほかのタグから使えないので、残すのは main で手で流した時だけ
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # SMLib の C++ の結果は毎晩の main の検査の回(verify.yml)が残した物を戻すだけにする
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/smlib-cache
          key: smlib-${{ runner.os }}-${{ hashFiles('crates/smlib-sys/build.rs', 'third_party/smlibpy-patches/**', 'third_party/usd-brep/VERSION') }}
          restore-keys: smlib-${{ runner.os }}-

      - name: cargo xtask release
        shell: bash
        env:
          SMLIB_CACHE_DIR: ${{ runner.temp }}/smlib-cache
        run: |
          set -eu
          tag=""
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="--tag ${{ github.ref_name }}"
          fi
          cargo xtask release $tag -p kmb-app -p kmb-cli -p kmb-mcp

      - name: 配る物をまとめる
        id: dist
        shell: bash
        run: |
          set -eu
          name="kie-monobench-${{ github.ref_name }}-${{ runner.os }}"
          name="${name//\//-}"
          ext=""
          if [ "${{ runner.os }}" = Windows ]; then ext=".exe"; fi
          mkdir -p "dist/$name"
          for b in kie-monobench kmb kmb-mcp; do cp "target/release/$b$ext" "dist/$name/"; done
          cp target/release/THIRD-PARTY-LICENSES.txt LICENSE-MIT LICENSE-APACHE "dist/$name/"
          # zip の中は「<名前>/」の 1 つのフォルダにする(展開しても散らばらない)
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip -bd "$name.zip" "$name" > /dev/null
          else
            zip -qr "$name.zip" "$name"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.name }}
          path: dist/${{ steps.dist.outputs.name }}.zip
          if-no-files-found: error

  # 両方の OS の zip がそろってから、まとめて 1 つの SHA256SUMS を作る(`sha256sum -c SHA256SUMS` で確かめられる形)
  sums:
    name: SHA256SUMS
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kie-monobench-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS を作る
        id: sums
        shell: bash
        run: |
          set -eu
          name="kie-monobench-${{ github.ref_name }}-SHA256SUMS"
          name="${name//\//-}"
          cd dist
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sums.outputs.name }}
          path: dist/SHA256SUMS
          if-no-files-found: error
