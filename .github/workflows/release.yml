# タグ(v<版>)を押すと、配る物を Linux と Windows で組み立てる(docs/verify.md の 15 節)。
# - 組み立ては `cargo xtask release`(この PC のパスを exe に残さない引数と数え、許諾文の一覧)。
#   タグはワークスペースの版と合うかを xtask が先に確かめる。
# - 検査は取り込みの前の PR の回と毎晩の main の回(verify.yml)が済ませているので、ここでは流さない。
# - OS ごとに「kie-monobench-<版>-<OS>-<arch>」にまとめ(Windows は zip、Linux は tar.gz)、
#   全部の SHA256SUMS.txt を最後の回で作る。
# - できた物は成果物(artifact)に置く。タグの回は GitHub のリリースを下書きで作って載せる。
#   公開は中身を確かめてから手で行う。
name: リリース

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Rust(rust-toolchain.toml の版)
        run: rustup toolchain install

      # タグの回で残した物はほかのタグから使えないので、残すのは main で手で流した時だけ
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # SMLib の C++ の結果は毎晩の main の検査の回(verify.yml)が残した物を戻すだけにする
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/smlib-cache
          key: smlib-${{ runner.os }}-${{ hashFiles('crates/smlib-sys/build.rs', 'third_party/smlibpy-patches/**', 'third_party/usd-brep/VERSION') }}
          restore-keys: smlib-${{ runner.os }}-

      - name: cargo xtask release
        shell: bash
        env:
          SMLIB_CACHE_DIR: ${{ runner.temp }}/smlib-cache
        run: |
          set -eu
          tag=""
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="--tag ${{ github.ref_name }}"
          fi
          cargo xtask release $tag -p kmb-app -p kmb-cli -p kmb-mcp

      - name: 配る物をまとめる
        id: dist
        shell: bash
        run: |
          set -eu
          # 版はタグから v を外した物、手で流した時はブランチの名前
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          ver="${ver//\//-}"
          ext=""
          if [ "${{ runner.os }}" = Windows ]; then
            ext=".exe"
            name="kie-monobench-$ver-windows-x64"
          else
            name="kie-monobench-$ver-linux-x86_64"
          fi
          mkdir -p "dist/$name"
          for b in kie-monobench kmb kmb-mcp; do cp "target/release/$b$ext" "dist/$name/"; done
          cp target/release/THIRD-PARTY-LICENSES.txt LICENSE-MIT LICENSE-APACHE README.md README.en.md "dist/$name/"
          # 中は「<名前>/」の 1 つのフォルダにする(展開しても散らばらない)
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            file="$name.zip"
            7z a -tzip -bd "$file" "$name" > /dev/null
          else
            file="$name.tar.gz"
            tar -czf "$file" "$name"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.name }}
          path: dist/${{ steps.dist.outputs.file }}
          if-no-files-found: error

  # 両方の OS の物がそろってから、まとめて 1 つの SHA256SUMS.txt を作る(`sha256sum -c SHA256SUMS.txt` で確かめられる形)。
  # タグの回はリリースを下書きで作り、全部を載せる
  sums:
    name: SHA256SUMS とリリースの下書き
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kie-monobench-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS.txt を作る
        id: sums
        shell: bash
        run: |
          set -eu
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          ver="${ver//\//-}"
          cd dist
          sha256sum -- *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "name=kie-monobench-$ver-SHA256SUMS" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sums.outputs.name }}
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: リリースを下書きで作る
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          ver="${{ steps.sums.outputs.ver }}"
          cat > notes.md <<EOT
          ## 入っている物
          | ファイル | 中身 |
          |---|---|
          | \`kie-monobench-$ver-windows-x64.zip\` | Windows 10・11(x64)。画面のアプリ \`kie-monobench.exe\`、CLI \`kmb.exe\`、MCP のサーバー \`kmb-mcp.exe\`、許諾文 |
          | \`kie-monobench-$ver-linux-x86_64.tar.gz\` | Linux(x86_64、glibc 2.39 以降。Ubuntu 24.04 以降など)。\`kie-monobench\`、\`kmb\`、\`kmb-mcp\`、許諾文 |
          | \`SHA256SUMS.txt\` | 上の 2 つの SHA-256 |

          - 展開してそのまま起動します(入れる手順は要りません)。
          - 署名はまだしていません。Windows では初回に SmartScreen の確認が出ることがあります。
          - \`THIRD-PARTY-LICENSES.txt\` は同梱した他者の部品とその許諾文の一覧です。
          - ライセンスは MIT または Apache-2.0 です。
          EOT
          gh release create "${{ github.ref_name }}" --draft --verify-tag \
            --title "kieMonoBench $ver" --notes-file notes.md \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt
