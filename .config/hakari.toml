# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "kmb-workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "2"

# Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html
platforms = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true

# 開発用の道具は、揃えた依存を待たずにすぐ動かす
[traversal-excludes]
workspace-members = ["xtask"]

# プラグイン作りに使う crate(見本のプラグインが組む物)は揃えた依存に入れない。
# 揃えた依存は画面の部品(egui など)を抱えるので、入れるとプラグインが WASM でもそれを組む。
[final-excludes]
workspace-members = [
    "kmb-cam-tool",
    "kmb-core",
    "kmb-expr",
    "kmb-format",
    "kmb-look",
    "kmb-post",
    "kmb-toolpath",
]
# 画面(egui・wgpu・naga)と WASM(wasmtime まわり)の重い依存は揃えた依存に入れない。入れると
# 画面にも WASM にも関係の無い crate(加工の戦略など)を 1 つ検査するだけでも、これらを全部組み立てる
# (戦略 1 つの組み立てが 189 crate・1.7 GB から 85 crate・0.73 GB になる。docs/verify.md の 2 節)。
# これらを使うのは画面とプラグインの crate だけで、互いに一緒に組むので機能の組み合わせはほぼ変わらない
third-party = [
    { name = "accesskit" },
    { name = "ecolor" },
    { name = "egui" },
    { name = "egui-wgpu" },
    { name = "emath" },
    { name = "epaint" },
    { name = "naga" },
    { name = "wayland-backend" },
    { name = "wgpu" },
    { name = "wgpu-core" },
    { name = "wgpu-core-deps-windows-linux-android" },
    { name = "wgpu-hal" },
    { name = "wgpu-types" },
    { name = "windows" },
    { name = "cranelift-bitset" },
    { name = "pulley-interpreter" },
    { name = "wasm-encoder" },
    { name = "wasmparser" },
    { name = "wasmtime-internal-core" },
]
