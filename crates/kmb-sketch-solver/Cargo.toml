version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.kmb]
layer = "cad"

[dependencies]
kmb-core.workspace = true
nalgebra.workspace = true
serde.workspace = true
kmb-workspace-hack = { version = "0.1", path = "../kmb-workspace-hack" }

[features]
# ヤコビ行列を計るたびに、式が使う変数の書き漏らしを全部の式を計り直して調べる(試験用。遅い)
check = []

[lints]
workspace = true
