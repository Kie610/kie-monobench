[package]
name = "jc-io-dxf"
description = "DXF(ASCII)の読み込みと書き出し、スケッチへの挿入と DXF での保存の操作"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# DXF・SVG はスケッチの形を読み書きするので CAD の層(G-code を読む jc-gcode-read が CAM の層なのと同じ)
[package.metadata.jc]
layer = "cad"

[dependencies]
jc-core.workspace = true
jc-interchange.workspace = true
jc-sketch.workspace = true
jc-format.workspace = true
serde_json.workspace = true
jc-workspace-hack = { version = "0.1", path = "../jc-workspace-hack" }

[dev-dependencies]
jc-io-svg.workspace = true
proptest.workspace = true

[lints]
workspace = true
