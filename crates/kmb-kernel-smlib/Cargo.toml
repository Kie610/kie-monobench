[package]
name = "kmb-kernel-smlib"
description = "SMLib(usd-brep)による形状カーネルの実装"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[package.metadata.kmb]
layer = "kernel"

[dependencies]
kmb-core.workspace = true
kmb-format.workspace = true
smlib-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
kmb-workspace-hack = { version = "0.1", path = "../kmb-workspace-hack" }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
kmb-contract.workspace = true
kmb-kernel-truck.workspace = true

# C++ の中継層を呼ぶ src/ffi.rs だけが unsafe を使う(ワークスペースの forbid の代わりに deny)
[lints.rust]
unsafe_code = "deny"
