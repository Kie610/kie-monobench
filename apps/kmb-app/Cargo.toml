[package]
name = "kmb-app"
description = "GUI の実行ファイル"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.kmb]
layer = "app"

[[bin]]
name = "kie-monobench"
path = "src/main.rs"

[dependencies]
kmb-core.workspace = true
kmb-ui.workspace = true
kmb-ui-sketch.workspace = true
kmb-ui-tools.workspace = true
kmb-ui-text.workspace = true
kmb-ui-library.workspace = true
kmb-bundle.workspace = true
kmb-session.workspace = true
rfd.workspace = true
eframe.workspace = true
log.workspace = true
kmb-workspace-hack = { version = "0.1", path = "../../crates/kmb-workspace-hack" }

[target.'cfg(windows)'.dependencies]
# 起動の窓を最初の画面まで覆い、作業域に収める src/win_start.rs だけが使う
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
kmb-interchange.workspace = true
kmb-look.workspace = true
serde_json.workspace = true
kmb-io-stl.workspace = true
kmb-samples.workspace = true
egui.workspace = true
egui_kittest.workspace = true

[features]
# SMLib のカーネルを入れる(外すと truck だけ。`--no-default-features`)
default = ["smlib"]
smlib = ["kmb-bundle/smlib"]

# Windows の OS の関数を呼ぶ src/win_start.rs だけが unsafe を使う(ワークスペースの forbid の代わりに deny)
[lints.rust]
unsafe_code = "deny"
