[package]
name = "jc-cli"
description = "文書を操作する CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.jc]
layer = "app"

[[bin]]
name = "kmb"
path = "src/main.rs"

[dependencies]
jc-core.workspace = true
jc-interchange.workspace = true
jc-bundle.workspace = true
jc-session.workspace = true
clap.workspace = true
serde_json.workspace = true
log.workspace = true
jc-workspace-hack = { version = "0.1", path = "../../crates/jc-workspace-hack" }

[features]
# SMLib のカーネルを入れる(外すと truck だけ。`--no-default-features`)
default = ["smlib"]
smlib = ["jc-bundle/smlib"]

[lints]
workspace = true
